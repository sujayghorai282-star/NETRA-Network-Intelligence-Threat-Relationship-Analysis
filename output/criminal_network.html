<style>

#investigator-panel {
    position: absolute;
    top: 15px;
    left: 15px;

    z-index: 9999;

    width: 300px;

    padding: 16px;

    background: rgba(15, 23, 42, 0.96);

    border: 1px solid rgba(148, 163, 184, 0.25);

    border-radius: 12px;

    color: #e5e7eb;

    font-family: Arial, sans-serif;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35);
}

#investigator-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
}

#investigator-subtitle {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 14px;
}

#entity-search {
    width: 100%;
    box-sizing: border-box;

    padding: 10px;

    background: #020617;

    color: #e5e7eb;

    border: 1px solid #334155;

    border-radius: 8px;

    outline: none;
}

#entity-search:focus {
    border-color: #60a5fa;
}

#search-results {
    margin-top: 8px;

    max-height: 180px;

    overflow-y: auto;
}

.search-result {
    padding: 8px;

    margin-bottom: 4px;

    border-radius: 6px;

    cursor: pointer;

    background: rgba(51, 65, 85, 0.45);
}

.search-result:hover {
    background: rgba(59, 130, 246, 0.25);
}

.result-name {
    font-weight: 600;
    font-size: 13px;
}

.result-type {
    color: #94a3b8;
    font-size: 11px;
}

#selected-entity {
    margin-top: 14px;

    padding-top: 12px;

    border-top: 1px solid #334155;

    font-size: 12px;

    color: #cbd5e1;
}

.entity-value {
    color: #f8fafc;

    font-weight: 600;
}

#network-legend {
    margin-top: 14px;

    padding-top: 12px;

    border-top: 1px solid #334155;
}

.legend-row {
    display: flex;

    align-items: center;

    margin: 7px 0;

    font-size: 12px;
}

.legend-dot {
    width: 12px;
    height: 12px;

    margin-right: 8px;

    border-radius: 50%;
}

.legend-diamond {
    width: 11px;
    height: 11px;

    margin-right: 9px;

    transform: rotate(45deg);
}

.legend-square {
    width: 11px;
    height: 11px;

    margin-right: 9px;
}

</style>

<div id="investigator-panel">

    <div id="investigator-title">
        Investigation Network
    </div>

    <div id="investigator-subtitle">
        Interactive entity relationship analysis
    </div>

    <input
        id="entity-search"
        type="text"
        placeholder="Search person or entity..."
        autocomplete="off"
    >

    <div id="search-results"></div>

    <div id="selected-entity">
        Select a node to inspect its network.
    </div>

    <div id="network-legend">

        <div class="legend-row">
            <div
                class="legend-dot"
                style="background:#2563eb;"
            ></div>
            Person
        </div>

        <div class="legend-row">
            <div
                class="legend-diamond"
                style="background:#7c3aed;"
            ></div>
            State
        </div>

        <div class="legend-row">
            <div
                class="legend-square"
                style="background:#dc2626;"
            ></div>
            Crime category
        </div>

        <div class="legend-row">
            <div
                style="
                    width:0;
                    height:0;
                    border-left:7px solid transparent;
                    border-right:7px solid transparent;
                    border-bottom:12px solid #d97706;
                    margin-right:8px;
                "
            ></div>
            Legal section
        </div>

        <div class="legend-row">
            <div
                class="legend-dot"
                style="background:#059669;"
            ></div>
            Other entity
        </div>

    </div>

</div>

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function showEntityInfo(nodeId) {

    const entity =
        investigatorNodes.find(
            function(item) {
                return String(item.id) === String(nodeId);
            }
        );

    if (!entity) {
        return;
    }

    selectedEntity.innerHTML =
        "<div><b>Selected entity</b></div>" +

        "<div style='margin-top:8px;'>" +
        "Name: " +
        "<span class='entity-value'>" +
        escapeHtml(entity.name) +
        "</span>" +
        "</div>" +

        "<div style='margin-top:5px;'>" +
        "Type: " +
        "<span class='entity-value'>" +
        escapeHtml(entity.type) +
        "</span>" +
        "</div>" +

        "<div style='margin-top:5px;'>" +
        "Connections: " +
        "<span class='entity-value'>" +
        entity.connections +
        "</span>" +
        "</div>";
}


function focusEntity(nodeId) {

    if (
        typeof network === "undefined"
    ) {
        return;
    }

    network.selectNodes(
        [nodeId]
    );

    network.focus(
        nodeId,
        {
            scale: 1.35,

            animation: {
                duration: 700,
                easingFunction: "easeInOutQuad"
            }
        }
    );

    showEntityInfo(nodeId);
}


searchInput.addEventListener(
    "input",
    function() {

        const query =
            this.value
                .trim()
                .toLowerCase();

        searchResults.innerHTML = "";

        if (!query) {
            return;
        }

        const matches =
            investigatorNodes
                .filter(
                    function(item) {
                        return item.name
                            .toLowerCase()
                            .includes(query);
                    }
                )
                .sort(
                    function(a, b) {
                        return b.connections -
                            a.connections;
                    }
                )
                .slice(0, 12);

        matches.forEach(
            function(entity) {

                const result =
                    document.createElement(
                        "div"
                    );

                result.className =
                    "search-result";

                result.innerHTML =
                    "<div class='result-name'>" +
                    escapeHtml(entity.name) +
                    "</div>" +

                    "<div class='result-type'>" +
                    escapeHtml(entity.type) +
                    " · " +
                    entity.connections +
                    " connections" +
                    "</div>";

                result.addEventListener(
                    "click",
                    function() {

                        focusEntity(
                            entity.id
                        );

                        searchInput.value =
                            entity.name;

                        searchResults.innerHTML =
                            "";
                    }
                );

                searchResults.appendChild(
                    result
                );
            }
        );
    }
);


setTimeout(

                    showEntityInfo(
                        params.nodes[0]
                    );
                }
            }
        );

    },
    1000
);
